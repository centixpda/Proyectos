function addLog(msg,cls){const d=document.getElementById('log');const e=document.createElement('div');e.className=cls;e.textContent=msg;d.appendChild(e);d.scrollTop=d.scrollHeight}
async function cargar(){
  const btn=document.getElementById('btn');
  btn.disabled=true;
  let ok=0,skip=0,err=0;
  for(let i=0;i<USUARIOS.length;i++){
    const u=USUARIOS[i];
    document.getElementById('prog').textContent='Procesando '+(i+1)+' de '+USUARIOS.length+'...';
    try{
      const snap=await db.collection('usuarios').doc(u.dni).get();
      if(snap.exists){addLog('[OMITIDO] '+u.dni+' - '+u.nombre,'info');skip++;}
      else{
        await db.collection('usuarios').doc(u.dni).set(Object.assign({},u,{creado:firebase.firestore.FieldValue.serverTimestamp()}));
        addLog('[OK] '+u.dni+' - '+u.nombre+' ('+u.rol+')','ok');
        ok++;
      }
    }catch(e){addLog('[ERROR] '+u.dni+': '+e.message,'err');err++;}
  }
  document.getElementById('prog').textContent='Terminado: '+ok+' cargados, '+skip+' omitidos, '+err+' errores';
  btn.textContent='Carga completada';
  addLog('=== FIN: '+ok+' OK / '+skip+' omitidos / '+err+' errores ===','info');
}
